<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 휴대폰에서도 화면 크기에 맞게 보이도록 하는 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 할 일</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>📝 나의 할 일</h1>

    <!-- 할 일 입력 영역 -->
    <form id="todo-form" class="todo-form">
      <input
        id="todo-input"
        type="text"
        placeholder="할 일을 입력하세요"
        autocomplete="off"
        maxlength="100"
      >
      <button type="submit">추가</button>
    </form>

    <!-- 남은 할 일 개수 표시 -->
    <p id="todo-count" class="todo-count"></p>

    <!-- 할 일 목록이 이곳에 그려집니다 -->
    <ul id="todo-list" class="todo-list"></ul>

    <!-- 목록이 비어 있을 때 보여줄 안내 문구 -->
    <p id="empty-message" class="empty-message">아직 할 일이 없어요. 위에서 추가해 보세요!</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
